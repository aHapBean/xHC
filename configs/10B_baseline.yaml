description: '10B baseline: paper architecture with native Megatron training.'
variant: baseline
execution:
  micro_batch_size: 1
  expert_model_parallel_size: 4
  dispatcher: alltoall
  hybridep_pad_multiple: 32
hyper_connection_settings: {}
arguments:
  hyper-connection: ${VARIANT}
  hyper-connection-seed: '1234'
  hyper-connection-settings: ${HC_SETTINGS}
  seed: '1234'
  num-layers: '15'
  hidden-size: '2080'
  ffn-hidden-size: '6144'
  mtp-num-layers: '0'
  num-attention-heads: '16'
  group-query-attention: true
  num-query-groups: '8'
  kv-channels: '128'
  seq-length: '8192'
  max-position-embeddings: '8192'
  position-embedding-type: rope
  rotary-base: '50000'
  normalization: RMSNorm
  norm-epsilon: 1e-05
  qk-layernorm: true
  swiglu: true
  disable-bias-linear: true
  untie-embeddings-and-output-weights: true
  init-method-std: '0.006'
  disable-scaled-init-method: true
  num-experts: '144'
  moe-layer-freq: '[0]+[1]*14'
  moe-ffn-hidden-size: '704'
  moe-shared-expert-intermediate-size: '704'
  moe-router-topk: '8'
  moe-router-score-function: sigmoid
  moe-router-load-balancing-type: seq_aux_loss
  moe-aux-loss-coeff: '0.0001'
  moe-router-enable-expert-bias: true
  moe-router-dtype: fp32
  moe-router-bias-update-rate: '0.001'
  moe-router-topk-scaling-factor: '1.0'
  expert-model-parallel-size: $EP
  expert-tensor-parallel-size: '1'
  moe-grouped-gemm: true
  moe-permute-fusion: true
  no-moe-chunk-sort-fusion: true
  cross-entropy-loss-fusion: true
  cross-entropy-fusion-impl: te
  bf16: true
  attention-dropout: '0'
  hidden-dropout: '0'
  recompute-granularity: full
  recompute-method: uniform
  recompute-num-layers: '1'
  micro-batch-size: $MBS
  global-batch-size: '288'
  train-iters: '20472'
  lr: '0.000482'
  min-lr: '4.82e-05'
  lr-warmup-iters: '500'
  lr-decay-iters: '20472'
  lr-decay-style: WSD
  lr-wsd-decay-iters: '4095'
  lr-wsd-decay-style: geometric
  weight-decay: '0.1'
  adam-beta1: '0.9'
  adam-beta2: '0.95'
  adam-eps: 1e-15
  clip-grad: '1.0'
  per-split-data-args-path: $DATA_ARGS
  data-cache-path: $DATA_CACHE
  tokenizer-type: HuggingFaceTokenizer
  tokenizer-model: $TOKENIZER_DIR
  padded-vocab-size: '152064'
  make-vocab-size-divisible-by: '128'
  eod-mask-loss: true
  no-create-attention-mask-in-dataloader: true
  num-workers: '2'
  eval-iters: '1'
  eval-interval: '100'
  log-interval: '1'
  distributed-timeout-minutes: '60'
  distributed-timeout-seconds-after-init: '600'
  tensorboard-dir: ${TENSORBOARD_DIR}
  tensorboard-log-interval: '1'
  log-throughput: true
  log-timers-to-tensorboard: true
  timing-log-level: '1'
  log-memory-to-tensorboard: true
  log-validation-ppl-to-tensorboard: true
  log-world-size-to-tensorboard: true
  use-distributed-optimizer: true
  overlap-grad-reduce: true
  accumulate-allreduce-grads-in-fp32: true
  save: $RUN_DIR/checkpoints
  load: $RUN_DIR/checkpoints
  save-interval: '500'
  ckpt-format: torch_dist
